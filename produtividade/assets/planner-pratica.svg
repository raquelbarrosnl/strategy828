<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Por dentro do Planner de 30 Dias</title><desc id="desc">Página prática ilustrada da fase Limitar, dia 18, com exemplo preenchido, perguntas de reflexão e escalas de energia e tensão.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e7e0d2"/><stop offset="1" stop-color="#f7f3eb"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#25332d" flood-opacity=".17"/></filter></defs>
<rect width="1200" height="900" rx="34" fill="url(#bg)"/><circle cx="1050" cy="110" r="180" fill="#d4c29e" opacity=".22"/>
<g filter="url(#shadow)">
 <rect x="145" y="70" width="910" height="760" rx="24" fill="#fffdf8" stroke="#d7cbb8" stroke-width="3"/>
 <rect x="185" y="110" width="830" height="45" rx="8" fill="#153e3b"/>
 <text x="215" y="140" font-family="Arial,sans-serif" font-size="20" fill="#fff8ec" letter-spacing="2">FASE 03 · LIMITAR</text>
 <text x="985" y="140" text-anchor="end" font-family="Arial,sans-serif" font-size="18" fill="#e8c98f">DIA 18</text>
 <text x="190" y="220" font-family="Georgia,serif" font-size="43" fill="#183d39">Rever um limite sem culpa</text>
 <text x="190" y="260" font-family="Arial,sans-serif" font-size="20" fill="#5f6b64">Observe o que aconteceu na prática — sem usar a culpa como medida de acerto.</text>
 <rect x="190" y="295" width="390" height="145" rx="12" fill="#f0e8d9" stroke="#d9c9aa" stroke-width="2"/>
 <text x="220" y="332" font-family="Arial,sans-serif" font-size="17" fill="#9a7440" letter-spacing="1.5">EXEMPLO PREENCHIDO</text>
 <text x="220" y="372" font-family="Georgia,serif" font-size="22" fill="#2d4942">“Não responder trabalho</text>
 <text x="220" y="402" font-family="Georgia,serif" font-size="22" fill="#2d4942">depois das 19h.”</text>
 <rect x="610" y="295" width="405" height="145" rx="12" fill="#e8eee7" stroke="#cfdbcf" stroke-width="2"/>
 <text x="640" y="332" font-family="Arial,sans-serif" font-size="17" fill="#54715e" letter-spacing="1.5">O QUE ACONTECEU?</text>
 <text x="640" y="372" font-family="Arial,sans-serif" font-size="20" fill="#2d4942">Duas mensagens ficaram</text>
 <text x="640" y="402" font-family="Arial,sans-serif" font-size="20" fill="#2d4942">para o dia seguinte. Nada grave.</text>
 <text x="190" y="500" font-family="Arial,sans-serif" font-size="17" fill="#987443" letter-spacing="1.5">AGORA É A SUA VEZ</text>
 <g font-family="Arial,sans-serif" font-size="21" fill="#304a43">
  <text x="190" y="550">Qual limite estabeleci?</text><path d="M190 570H570" stroke="#d5c7b1" stroke-width="2"/>
  <text x="610" y="550">O que aconteceu na prática?</text><path d="M610 570H1015" stroke="#d5c7b1" stroke-width="2"/>
  <text x="190" y="625">Precisa ser mantido ou ajustado?</text><path d="M190 645H570" stroke="#d5c7b1" stroke-width="2"/>
  <text x="610" y="625">Qual será minha próxima comunicação?</text><path d="M610 645H1015" stroke="#d5c7b1" stroke-width="2"/>
 </g>
 <rect x="190" y="685" width="825" height="92" rx="12" fill="#f7f1e6" stroke="#dfd1b9"/>
 <text x="220" y="720" font-family="Arial,sans-serif" font-size="17" fill="#9a7440" letter-spacing="1.3">TERMÔMETRO DO DIA</text>
 <text x="220" y="755" font-family="Arial,sans-serif" font-size="20" fill="#304a43">Energia percebida  0–10</text>
 <path d="M480 750H650" stroke="#b58a4b" stroke-width="5" stroke-linecap="round"/><circle cx="565" cy="750" r="10" fill="#153e3b"/>
 <text x="700" y="755" font-family="Arial,sans-serif" font-size="20" fill="#304a43">Tensão percebida  0–10</text>
 <path d="M930 750H980" stroke="#b58a4b" stroke-width="5" stroke-linecap="round"/>
</g>
<text x="600" y="870" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#8a795e" letter-spacing="3">STRATEGY828 BOOKS · UM DIA DE CADA VEZ</text>
</svg>